
<div class="container-fluid mt-4">
  <div class="text-center mb-3">
    <div class="justify-content-center">
      <button class="btn btn-outline-saveR px-1" type="button" (click)="abrirModalCrear()" style="width: 190px;"><i class="bi bi-person-fill-add me-2"></i> Nuevo usuario</button>
    </div>
  </div>
</div>

<div class="modal fade" id="usuarioModal" tabindex="-1" aria-labelledby="usuarioModal" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="usuarioModalLabel">
          {{esEdicion() ? 'Editar usuario': 'Agregar Usuario'}}
        </h5>
        <button class="btn-close btn-close-white" type="button" (click)="cerrarModal()"></button>
      </div>
      <form (submit)="guardar($event)">
        
          <div class=" modal-body">
            <div class="row mb-3">
              <div class="col-lg-3 col-sm-12 col-md-3">
                <label class="form-label">Nombre<span class="asterisco ms-2">*</span></label>
                <input class="form-control" type="text" [class.is-invalid]="esInvalido(userForm.nombre().value())" [formField]="userForm.nombre">
              </div>
              <div class="col-lg-3 col-sm-12 col-md-3">
                <label class="form-label">Email<span class="asterisco ms-2">*</span></label>
                <input class="form-control" type="text" [class.is-invalid]="esInvalido(userForm.correo().value())" [formField]="userForm.correo">
              </div>
              <div class="col-lg-3 col-sm-12 col-md-3">
                <label class="form-label">Usuario<span class="asterisco ms-2">*</span></label>
                <input class="form-control" type="text" [class.is-invalid]="esInvalido(userForm.userName().value())" [formField]="userForm.userName">
              </div>
              <div class="col-lg-3 col-sm-12 col-md-3">
                <label class="form-label">Rol<span class="asterisco ms-2">*</span></label>
                <select class="form-select text-center" [class.is-invalid]="esInvalido(userForm.rol().value())" [formField]="userForm.rol">
                  <option value="" disabled selected>.::Seleccione::.</option>
                  @for(opcion of opcionesRoles(); track opcion.value){
                    <option [value]="opcion.value">{{opcion.label}}</option>
                  }
                </select>
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-lg-3 col-sm-12 col-md-3">
                <label class="form-label">password<span class="asterisco ms-2">*</span></label>
                <input class="form-control" type="text" [class.is-invalid]="esInvalido(userForm.password?.()?.value() || '')" 
                  [formField]="userForm.password!">
              </div>
            
              <div class="col-lg-3 col-sm-12 col-md-3">
                <label class="form-label">confirma password<span class="asterisco ms-2">*</span></label>
                <input class="form-control" type="text" [class.is-invalid]="esInvalido(userForm.confirmaPassword?.()?.value() || '')" [formField]="userForm.confirmaPassword!">
              </div>
            
              <div class="col-lg-3 col-sm-12 col-md-3">
                <label class="form-label">Area<span class="asterisco ms-2">*</span></label>
                <select class="form-select text-center" [class.is-invalid]="esInvalido(userForm.area().value())" [formField]="userForm.area">
                  <option value="" disabled selected>.::Seleccione::.</option>
                  @for(opcion of opcionesAreas(); track opcion.value){
                    <option [value]="opcion.value">{{opcion.label}}</option>
                  }
                </select>
              </div>
            <div class="col-lg-2 col-sm-12 col-md-2 ms-5" >
              <label class="form-check-label fw-semibold mb-4" for="autorizaCheck">Autoriza</label>
              <div class="form-check form-switch">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  role="switch"
                  id="autorizaCheck"
                  [formField]="userForm.autorizaVacaciones"
                >
                
              </div>
            </div>
          </div>
          <div class="row justify-content-center mt-3 mb-3">
           <button type="button" class="btn btn-sm btn-outline-reset me-2" style="width: 140px;" (click)="cerrarModal()">Cancelar</button>
            <button class="btn btn-sm btn-outline-saveR px-1" style="width: 140px;" type="submit" [disabled]="userForm().invalid()">
              {{ esEdicion() ? 'Actualizar' : 'Guardar' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="card contededor-principal mt-5 mb-5">
  <div class="card-header d-flex justify-content-center align-items-center">
    <label class="titulo">Usuarios</label>
  </div>
  <div class="card-body p-3">
    <app-tabla-generica
      [filas]="usuarios()"
      [columnas]="columnasUsuarios"
      [cargando]="cargando()"
      [limitePorPagina]="5"
      (onAccion)="manejarAccionTabla($event)"
      >
    </app-tabla-generica>
  </div>
</div>
